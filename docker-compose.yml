version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_chromadb:/app/chroma_db
    env_file:
      - .env
    environment:
      - PORT=8000
      - SQLITE_DB_URL=sqlite:///./sql_app.db
      - CHROMA_PERSIST_DIR=./chroma_db
      - UPLOAD_DIR=./uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevent overwriting container node_modules
    depends_on:
      - backend
    restart: always

volumes:
  backend_uploads:
  backend_chromadb:
